<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-start {
            background: var(--primary);
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-stop:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
            color: white;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-card {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--glass-border);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: var(--text-muted);
        }

        .status-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            margin-right: 8px;
        }

        .pulse.active {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Live Stream Downloader</h1>
        
        <div class="input-group">
            <label for="urlInput">YouTube Live URL</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="input-group" style="flex: 1; margin-bottom: 0;">
                <label for="startTimeInput">Start Time (Optional)</label>
                <input type="text" id="startTimeInput" placeholder="e.g., 01:20:00">
            </div>
            <div class="input-group" style="flex: 1; margin-bottom: 0;">
                <label for="endTimeInput">End Time (Optional)</label>
                <input type="text" id="endTimeInput" placeholder="e.g., 02:30:00">
            </div>
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn-start" onclick="startDownload()">Start Download</button>
            <button id="stopBtn" class="btn-stop" onclick="stopDownload()" disabled>Stop</button>
        </div>

        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Status</span>
                <span class="status-value"><span id="pulseIndicator" class="pulse"></span><span id="statusText">Idle</span></span>
            </div>
            <div class="status-row">
                <span class="status-label">File Name</span>
                <span class="status-value" id="fileNameText">-</span>
            </div>
            <div class="status-row">
                <span class="status-label">File Size</span>
                <span class="status-value" id="fileSizeText">0 MB</span>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast">Message</div>

    <script>
        let statusInterval;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 MB';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const startTime = document.getElementById('startTimeInput').value.trim();
            const endTime = document.getElementById('endTimeInput').value.trim();
            
            if (!url) {
                showToast("Please enter a valid URL");
                return;
            }

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        url: url,
                        start_time: startTime,
                        end_time: endTime
                    })
                });
                const data = await response.json();
                
                if (response.ok) {
                    showToast(data.message);
                    updateUIState(true);
                    startPolling();
                } else {
                    showToast(data.detail || "Error starting download");
                }
            } catch (e) {
                showToast("Connection error");
            }
        }

        async function stopDownload() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                showToast(data.message);
            } catch (e) {
                showToast("Connection error");
            }
        }

        function updateUIState(isRunning) {
            document.getElementById('startBtn').disabled = isRunning;
            document.getElementById('stopBtn').disabled = !isRunning;
            document.getElementById('urlInput').disabled = isRunning;
            document.getElementById('startTimeInput').disabled = isRunning;
            document.getElementById('endTimeInput').disabled = isRunning;
            
            const pulse = document.getElementById('pulseIndicator');
            if (isRunning) {
                pulse.classList.add('active');
            } else {
                pulse.classList.remove('active');
            }
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('statusText').innerText = data.status_msg;
                document.getElementById('fileNameText').innerText = data.output_file || '-';
                document.getElementById('fileSizeText').innerText = formatBytes(data.file_size_bytes);
                
                updateUIState(data.is_running);
                
                if (!data.is_running && statusInterval) {
                    clearInterval(statusInterval);
                    statusInterval = null;
                }
            } catch (e) {
                console.error("Failed to fetch status");
            }
        }

        function startPolling() {
            if (!statusInterval) {
                fetchStatus();
                statusInterval = setInterval(fetchStatus, 2000);
            }
        }

        // Initial check on load
        startPolling();
    </script>
</body>
</html>
