<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --glass-bg: rgba(24, 24, 27, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --secondary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(244, 63, 94, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.15), transparent 25%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #f43f5e, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
        }
        
        select option {
            background: #18181b;
            color: white;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), #fb923c);
            color: white;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .progress-container {
            margin-top: 25px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 14px 24px;
            border-radius: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            font-weight: 500;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube Downloader</h1>
        <div class="subtitle">Download videos in high quality instantly</div>
        
        <div class="input-group">
            <label for="urlInput">YouTube URL</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="qualitySelect">Video Quality</label>
            <select id="qualitySelect">
                <option value="best">Best Available (Default)</option>
                <option value="1080p">1080p</option>
                <option value="720p">720p</option>
                <option value="480p">480p</option>
            </select>
        </div>

        <button id="downloadBtn" class="btn-download" onclick="startDownload()">Download Video</button>

        <div class="progress-container" id="progressContainer">
            <div class="status-text">
                <span id="statusLabel">Starting...</span>
                <span id="percentLabel">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast">Message</div>

    <script>
        let currentDownloadId = null;
        let pollInterval = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const quality = document.getElementById('qualitySelect').value;
            
            if (!url) {
                showToast("Please enter a valid YouTube URL");
                return;
            }

            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('statusLabel').innerText = "Starting request...";
            document.getElementById('progressFill').style.width = "0%";
            document.getElementById('percentLabel').innerText = "0%";

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, quality })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentDownloadId = data.download_id;
                    showToast("Download started successfully");
                    pollInterval = setInterval(checkStatus, 1500);
                } else {
                    showToast(data.detail || "Error starting download");
                    resetUI();
                }
            } catch (e) {
                showToast("Connection error. Is the server running?");
                resetUI();
            }
        }

        async function checkStatus() {
            if (!currentDownloadId) return;

            try {
                const response = await fetch(`/api/download/${currentDownloadId}/status`);
                if (!response.ok) return;

                const data = await response.json();
                
                if (data.status === 'downloading') {
                    document.getElementById('statusLabel').innerText = "Downloading...";
                    const progress = data.progress || 0;
                    document.getElementById('progressFill').style.width = `${progress}%`;
                    document.getElementById('percentLabel').innerText = `${progress.toFixed(1)}%`;
                } 
                else if (data.status === 'completed') {
                    document.getElementById('statusLabel').innerText = "Download Complete!";
                    document.getElementById('progressFill').style.width = "100%";
                    document.getElementById('percentLabel').innerText = "100%";
                    showToast("Video downloaded to /downloads folder");
                    
                    clearInterval(pollInterval);
                    setTimeout(resetUI, 3000);
                }
                else if (data.status === 'failed') {
                    document.getElementById('statusLabel').innerText = "Download Failed!";
                    showToast("An error occurred during download");
                    
                    clearInterval(pollInterval);
                    setTimeout(resetUI, 2000);
                }
            } catch (e) {
                console.error("Failed to check status", e);
            }
        }

        function resetUI() {
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('urlInput').value = '';
            document.getElementById('progressContainer').style.display = 'none';
            currentDownloadId = null;
            if (pollInterval) clearInterval(pollInterval);
        }
    </script>
</body>
</html>
